; PlatformIO Project Configuration File
; Hệ thống máy ấp trứng: Arduino Uno + ESP8266 Web UI

[platformio]
; Chọn môi trường mặc định muốn build/nạp (có thể đổi thành uno khi nạp code cho Arduino)
default_envs = uno
; default_envs = esp8266

; ================================================================
; ===== 1. MÔI TRƯỜNG DÀNH CHO ESP8266 (Web Server & WiFi) =======
; ================================================================
[env:esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino

; QUAN TRỌNG: Đổi về 9600 baud để đồng bộ với SoftwareSerial (A0/A1) của Arduino Uno
monitor_speed = 115200
upload_speed = 57600
upload_resetmethod = nodemcu

; Chống reset/treo chip khi mở Serial Monitor trên VS Code
monitor_rts = 0
monitor_dtr = 0

; Chỉ biên dịch file esp_main.cpp, bỏ qua file main.cpp của Arduino
build_src_filter = +<esp_main.cpp>

; Cổng nạp cho ESP8266 (bỏ dấu ; ở đầu nếu bạn muốn chỉ định cổng cố định)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0


; ================================================================
; ===== 2. MÔI TRƯỜNG DÀNH CHO ARDUINO UNO (Cảm biến & Relay) ====
; ================================================================
[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; Chỉ biên dịch file main.cpp, bỏ qua esp_main.cpp của ESP
build_src_filter = +<main.cpp>

; Danh sách thư viện điều khiển cảm biến, màn hình và thời gian thực
lib_deps = 
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4
    makuna/RTC @ ^2.4.2

; Cổng nạp của Uno (thường là /dev/ttyACM0 trên Linux/Ubuntu hoặc COMx trên Windows)
; upload_port = /dev/ttyACM0
; monitor_port = /dev/ttyACM0